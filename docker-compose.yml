services:
  athlete-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: athlete-dashboard:latest
    container_name: athlete-dashboard
    ports:
      - "8501:8501"
    environment:
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
